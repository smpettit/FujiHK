[platformio]
default_envs = esp32dev

[env]
platform = espressif32@8.0.0
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps = 
	FujiHeatPump=https://github.com/unreality/FujiHeatPump.git
	HomeSpan=https://github.com/HomeSpan/HomeSpan.git#2.1.8

[env:m5stack-atom]
board = m5stack-atom

[env:esp32dev]
board = esp32dev
monitor_echo = yes
build_flags =
	-D BTN_PIN=0
	-D LED_PIN=-1
