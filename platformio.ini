[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
lib_deps = 
	FujiHeatPump=https://github.com/unreality/FujiHeatPump.git
	HomeSpan=https://github.com/HomeSpan/HomeSpan.git#release-1.9.1

[env:m5stack-atom]
board = m5stack-atom

[env:esp32dev]
board = esp32dev
monitor_echo = yes
build_flags =
	-D BTN_PIN=0
	-D LED_PIN=-1
